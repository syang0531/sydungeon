org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
# 26.2 requires Java 25. Same stack as syalchemy and syvillage so the three play together.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.88
neo_version_range=[26.2.0,)
loader_version_range=[4,)

# Parchment mappings are not published for 26.2 yet.
# parchment_minecraft_version=26.2
# parchment_mappings_version=

# Mod metadata
mod_id=sydungeon
mod_name=SY Dungeon
mod_license=MIT
mod_version=0.2.0
mod_group_id=com.syang.sydungeon
mod_authors=syang
# Keep this file pure ASCII. Gradle reads .properties as ISO-8859-1, so a non-ASCII
# character here lands mangled in neoforge.mods.toml and shows up in the mod list.
mod_description=Randomly assembled dungeons to explore - a maze-like prison first, a pyramid and a wizard's castle later - built from hand-made pieces that vanilla jigsaw generation joins together.
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/sydungeon

# CurseForge - numeric project ID from the mod's CurseForge page (set after registering the project).
curseforge_project_id=1703811

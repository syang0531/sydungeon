org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
# 26.2 requires Java 25.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.88
neo_version_range=[26.2.0,)
loader_version_range=[4,)

# Parchment mappings are not published for 26.2 yet.
# parchment_minecraft_version=26.2
# parchment_mappings_version=

# Mod metadata
mod_id=sydungeon
mod_name=SY Dungeon
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.syang.sydungeon
mod_authors=syang
# Keep this file pure ASCII. Gradle reads .properties as ISO-8859-1, so a non-ASCII
# character here lands mangled in neoforge.mods.toml and shows up in the mod list.
mod_description=Twenty-seven dungeons the game assembles differently every time, built from hand-made pieces that vanilla jigsaw generation joins together. Fifteen large ones with a boss and a guaranteed reward - across the overworld, the Nether and the End - and twelve small ones that hand you a bed and a stack of torches. Reach the end of the game by exploring instead of farming and mining.
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/sydungeon

# CurseForge - numeric project ID from the mod's CurseForge page (set after registering the project).
curseforge_project_id=1703811
